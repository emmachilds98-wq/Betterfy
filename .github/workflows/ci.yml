name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Playwright is not a dependency of the page; CI installs it only so
      # test/pageload.test.mjs can load the built page in a real browser.
      # With CI set, that test fails rather than skips when no browser is found.
      - run: npm install --no-save playwright@1
      - run: npx playwright install --with-deps chromium
      # Unit tests and the page-load check (npm test), then the browser specs
      # under test/e2e (npm run e2e) as their own step so a failure says which.
      - run: npm test
      - run: npm run e2e
