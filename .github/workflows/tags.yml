# Fold contributed Last.fm tags into docs/tags.json.
#
# Tag coverage is the ceiling on every suggestion Betterfy makes, and the
# shipped table only ever covered one person's artists. Browsers offer what
# Last.fm told them; this folds it back into the file everyone downloads, so
# nobody re-solves a gap someone else has already filled.
#
# Deliberately a build-time job rather than a runtime read: the page's read path
# does not change at all, so no listener pays a per-artist database read and the
# free tier is never in play. The merge itself needs no secret — contributions
# are public tag data this workflow is about to publish anyway, and the config
# it needs is already baked into the published page. Only the optional prune
# step (deleting contributions this run has already accounted for, so the
# collection does not grow forever) needs one: FIREBASE_SERVICE_ACCOUNT, a
# service account JSON key with Firestore access. Left unset, the merge still
# runs exactly as before — pruning is a tidiness feature, not a dependency.
#
# Writes to tagContributions are unauthenticated by design, which means the
# validation in merge-tags.mjs checks *shape*, not *truth* — anyone can look up
# a real Spotify artist ID the shipped table doesn't cover yet and submit a
# plausible but false genre tag for it. This used to push straight to main, so
# a bad one shipped to every listener the same night, review-if-ever. It now
# opens a PR instead: the diff is small (usually a handful of new artists) and
# gets a human's eyes before anything goes live.
name: Shared tags

on:
  schedule:
    - cron: '17 4 * * *'      # daily, off the hour so it is not queued with everything else
  workflow_dispatch:          # and on demand, for when you want to watch it work

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: shared-tags
  cancel-in-progress: false   # never interrupt a run partway through a commit

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # If the merge is wrong, everything downstream is wrong inside a 400KB
      # file nobody reads by hand. Same gate as CI, before anything is written.
      - run: node --test

      - name: Merge contributions
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node merge-tags.mjs

      # tags.json is fetched with a cache-busting build stamp, so a new table
      # needs a new build before it reaches anyone.
      - name: Rebuild the page
        run: npm run build:web

      - name: Open a PR if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- docs/tags.json; then
            echo "No new artists — nothing to commit."
            exit 0
          fi
          count=$(node -e 'import("node:fs").then(fs =>
            console.log(Object.keys(JSON.parse(fs.readFileSync("docs/tags.json","utf8"))).length))')
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # One rolling branch rather than a new one per run, so a quiet week
          # does not leave a pile of stale PRs to sort through.
          BRANCH=shared-tags-update
          git checkout -B "$BRANCH"
          git add docs/tags.json docs/index.html
          git commit -m "Shared tags: ${count} artists covered" \
                     -m "Contributed Last.fm tags for artists the shipped table did not cover."
          git push -f origin "$BRANCH"
          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            echo "PR already open on $BRANCH — the push above updated it."
          else
            gh pr create --base main --head "$BRANCH" \
              --title "Shared tags: ${count} artists covered" \
              --body "Unauthenticated contributions folded in since the last run — review the diff in \`docs/tags.json\` before merging. See the workflow comment in \`.github/workflows/tags.yml\` for why this is a PR rather than a direct push."
          fi
