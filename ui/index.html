<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Betterfy</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>🎛️</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/theme.css">
</head>
<body class="shell">
<aside>
  <div class="brand">Better<span>fy</span></div>
  <div class="who" id="who">connecting…</div>
  <button class="nav" data-v="home" aria-current="true">Overview</button>
  <button class="nav" data-v="find">Find &amp; add</button>
  <div class="navgap"></div>
  <button class="nav" data-v="inbox">Inbox <span class="c" id="c-inbox"></span></button>
  <button class="nav" data-v="dupes">Duplicates <span class="c" id="c-dupes"></span></button>
  <button class="nav" data-v="misfile">Misfiles <span class="c" id="c-misfile"></span></button>
  <button class="nav" data-v="cross">Cross-filed <span class="c" id="c-cross"></span></button>
  <button class="nav" data-v="new">New playlists <span class="c" id="c-new"></span></button>
  <div class="navgap"></div>
  <button class="nav" data-v="discover">Discover <span class="c" id="c-disc"></span></button>
  <button class="nav" data-v="history">History</button>
  <div class="railfoot">
    <span id="foot"></span>
    <button id="showKeys">Keyboard <kbd>?</kbd></button>
  </div>
</aside>

<main id="main">
  <div class="boot"><div class="in">
    <h1>Reading your library</h1>
    <p class="lede" id="bootsay">Opening the snapshot…</p>
  </div></div>
</main>

<div class="undobar" id="undobar" hidden></div>

<div class="sheet" id="keysheet" hidden><div class="in">
  <h2>Keyboard</h2>
  <div class="keys">
    <kbd>1</kbd><span>File to the first suggestion</span>
    <kbd>2</kbd><span>File to the second</span>
    <kbd>3</kbd><span>File to the third</span>
    <kbd>P</kbd><span>Play the track on your Spotify device</span>
    <kbd>S</kbd><span>Skip — leave it unfiled for now</span>
    <kbd>U</kbd><span>Unlike it</span>
    <kbd>/</kbd><span>Jump to Find &amp; add</span>
    <kbd>Z</kbd><span>Undo the last change</span>
    <kbd>?</kbd><span>This list</span>
  </div>
  <div class="rowbtns"><button class="b" id="closeKeys">Close</button></div>
</div></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mmss = ms => ms == null ? '—' : `${Math.floor(ms/60000)}:${String(Math.round(ms%60000/1000)).padStart(2,'0')}`;
const num = n => (n ?? 0).toLocaleString();

/** Roughly how long a filing session is: about eight seconds a track. */
const mins = n => n < 60 ? 'a couple of minutes' : `about ${Math.round(n * 8 / 60)} minutes`;

const api = async (path, body) => {
  const r = await fetch('/api/' + path, body ? {
    method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(body)
  } : {});
  const j = await r.json();
  if (!r.ok || j.error) throw new Error(j.error ?? r.statusText);
  return j;
};

let S = { inboxAt:0, crossMin:3, mfBand:'high' }, view = 'home', data = {};

/* ---------------- feedback ---------------- */

// Undo stays until it is used or dismissed. An undo for a destructive change
// on a nine-second timer is a change you cannot actually take back.
let lastUndoAt = null;
function say(msg, undoAt) {
  const el = $('#undobar');
  lastUndoAt = undoAt ?? null;
  el.innerHTML = `<span class="msg">${esc(msg)}</span>` +
    (undoAt ? '<button id="undoBtn">Undo <kbd>Z</kbd></button>' : '') +
    '<button class="x" id="dismiss" aria-label="Dismiss">✕</button>';
  el.hidden = false;
  $('#dismiss').onclick = () => { el.hidden = true; lastUndoAt = null; };
  if (undoAt) $('#undoBtn').onclick = undoLast;
  if (!undoAt) setTimeout(() => { if (!lastUndoAt) el.hidden = true; }, 4000);
}

async function undoLast() {
  if (!lastUndoAt) return say('Nothing to undo.');
  const at = lastUndoAt;
  lastUndoAt = null;
  try {
    await api('undo', { at });
    say('Put back.');
    data = await loadAll();
    await refresh();
  } catch (e) { say('Undo failed: ' + e.message); }
}

const art = (url, big) => url
  ? `<img class="art${big?' lg':''}" src="${esc(url)}" alt="" loading="lazy">`
  : `<div class="art${big?' lg':''} ph">♪</div>`;

/** Cosine similarity as three steps, which is all anyone can act on. */
function conf(score) {
  const s = score >= .55 ? 3 : score >= .35 ? 2 : 1;
  const word = ['thin', 'likely', 'strong'][s - 1];
  return `<span class="conf s${s}" title="${(score*100).toFixed(0)}% tag overlap">
    <span class="meter"><i></i><i></i><i></i></span><span class="t">${word}</span></span>`;
}

/* ---------------- views ---------------- */

function vHome() {
  const filed = S.tracks ?? 0, todo = S.backlog ?? 0;
  const pct = filed + todo ? filed / (filed + todo) * 100 : 100;
  const cells = [
    ['exact','Exact repeats',  S.exact,     'Same recording twice in one playlist','act','dupes'],
    ['clash','Version clashes',S.clash,     'Two different cuts, one playlist','warn','dupes'],
    ['misfiled','Misfiles',    S.misfiled,  'Fit another playlist far better','warn','misfile'],
    ['crossFiled','Cross-filed',S.crossFiled,'In more than one playlist','','cross'],
    ['clusters','New playlists',S.clusters, 'Clusters with no home','','new'],
    ['placements','Placements',S.placements,'Total filings across '+num(S.playlists)+' playlists','',null],
  ];

  return `<h1>Overview</h1>
    <p class="lede">Snapshot taken ${esc((S.captured ?? '').slice(0,10))}. Nothing here touches your
      Spotify library until you act on it, and every change can be undone.</p>

    <div class="lead">
      <div>
        <span class="lbl">Liked but in no playlist</span>
        <span class="n">${num(todo)}</span>
        <p class="say">${todo
          ? `That is ${mins(todo)} of filing. The Inbox suggests a home for each one and remembers where you were.`
          : 'Nothing is waiting. Your whole library is filed.'}</p>
        <div class="bar">
          <i class="filed" style="width:${pct.toFixed(2)}%"></i>
          <i class="todo" style="width:${(100-pct).toFixed(2)}%"></i>
        </div>
        <div class="barkey">
          <span><i style="background:var(--signal)"></i>${num(filed)} filed</span>
          <span><i style="background:var(--accent)"></i>${num(todo)} waiting</span>
        </div>
      </div>
      <div class="go">
        ${todo ? '<button class="b p" data-go="inbox">Start filing</button>' : ''}
        <button class="b" data-go="find">Find &amp; add</button>
      </div>
    </div>

    <div class="strip">${cells.map(([k,l,n,d,c,go]) => `
      <${go?'button':'div'} class="cell ${c}" ${go?`data-go="${go}"`:''}>
        <span class="lbl">${esc(l)}</span><span class="n">${num(n)}</span><span class="d">${esc(d)}</span>
      </${go?'button':'div'}>`).join('')}
    </div>

    <h2>Refresh</h2>
    <p class="lede">Re-reads only the playlists that actually changed, so this is quick.</p>
    <div class="rowbtns">
      <button class="b" data-step="snapshot">Re-read library</button>
      <button class="b" data-step="dupes">Recompute duplicates</button>
      <button class="b" data-step="misfile">Recompute filing</button>
    </div>`;
}

function vInbox() {
  const b = data.backlog;
  if (!b || !b.rows.length) return `<h1>Inbox</h1>
    <div class="empty"><b>Nothing unfiled</b>Every liked song sits in a playlist.</div>`;

  const i = Math.min(S.inboxAt, b.rows.length - 1);
  const t = b.rows[i];
  const opts = b.targets.slice().sort((x,y) => x.name.localeCompare(y.name));

  return `<h1>Inbox</h1>
    <p class="lede"><b>${num(b.total)}</b> liked tracks sit in no playlist — ${mins(b.total)} of filing.</p>
    <div class="deck">
      <span class="prog"><i style="width:${(i / b.rows.length * 100).toFixed(2)}%"></i></span>
      <div class="body">
        <div class="now">
          ${art(t.art, true)}
          <div>
            <p class="t">${esc(t.title)}</p>
            <p class="a">${esc(t.artist)}</p>
            <div class="m">
              <span>${esc(t.album ?? '')}</span><em>·</em>
              <span>${esc((t.released ?? '').slice(0,4))}</span><em>·</em>
              <span>${mmss(t.dur)}</span><em>·</em>
              <span>liked ${esc(t.added)}</span>
            </div>
            ${t.tags.length ? `<div class="tagrow" style="margin-top:10px">${t.tags.map(x => `<span class="tag">${esc(x)}</span>`).join('')}</div>` : ''}
          </div>
        </div>

        ${t.suggest.length
          ? `<div class="picks">${t.suggest.slice(0,3).map((s,n) => `
              <button class="pick" data-file="${esc(s.id)}">
                <kbd>${n+1}</kbd>
                <span><span class="nm">${esc(s.name)}</span> <span class="ax">${esc(s.axis ?? '')}</span></span>
                ${conf(s.score)}
              </button>`).join('')}</div>`
          : `<p class="why" style="margin-top:16px">No confident suggestion — either no Last.fm tags
               for this artist, or it genuinely fits nothing you have. File it by hand below, or
               skip and it stays in your liked songs.</p>`}

        <div class="rowbtns">
          <button class="b" data-act="play">Play <kbd>P</kbd></button>
          <button class="b q" data-act="skip">Skip <kbd>S</kbd></button>
          <button class="b q" data-act="unlike">Unlike <kbd>U</kbd></button>
          <select id="anyPl" style="margin-left:auto"><option value="">File somewhere else…</option>
            ${opts.map(o => `<option value="${esc(o.id)}">${esc(o.name)}</option>`).join('')}</select>
        </div>
        <div class="m" style="margin-top:14px; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-3)">
          ${i + 1} of ${num(b.rows.length)} loaded · ${num(b.total)} total
        </div>
      </div>
    </div>`;
}

function vFind() {
  const r = data.find, q = S.q ?? '';
  const body = S.finding
    ? '<div class="empty">Searching Spotify…</div>'
    : !r
      ? `<div class="empty"><b>Search Spotify</b>Find a track and file it straight into a playlist.
           Anything you already own is flagged before you add it twice.</div>`
      : !r.rows.length
        ? '<div class="empty"><b>Nothing found</b>Try the artist and the track together.</div>'
        : `<div class="rows">${r.rows.map((t, i) => {
            const owned = t.have.exact.length || t.have.liked;
            const dupe = !owned && t.have.samesong.length;
            return `<div class="row">
              ${art(t.art)}
              <div class="main">
                <div class="ttl">${esc(t.name)}</div>
                <div class="sub">${esc(t.artists.map(a => a.name).join(', '))} · ${esc(t.album ?? '')} ·
                  <span class="mono">${esc((t.released ?? '').slice(0,4))}</span> ·
                  <span class="mono">${mmss(t.duration_ms)}</span></div>
                ${owned ? `<div style="margin-top:6px"><span class="pill ok">✓ ${t.have.exact.length
                    ? 'In ' + esc(t.have.exact.slice(0,2).join(', ')) : 'Liked'}</span></div>` : ''}
                ${dupe ? `<div style="margin-top:6px"><span class="pill warn">You own this record already —
                    ${esc(t.have.samesong[0].album ?? 'another release')} in ${esc(t.have.samesong[0].playlist)}</span></div>` : ''}
              </div>
              <div class="acts">
                ${t.suggest.slice(0,2).map(sg =>
                  `<button class="b sm p" data-addto="${esc(sg.id)}" data-addi="${i}">+ ${esc(sg.name)}</button>`).join('')}
                <select data-addsel="${i}"><option value="">File into…</option>
                  ${r.targets.map(o => `<option value="${esc(o.id)}">${esc(o.name)}</option>`).join('')}</select>
                <button class="b sm q" data-dplay="${esc(t.id)}">Play</button>
              </div>
            </div>`;
          }).join('')}</div>`;

  return `<h1>Find &amp; add</h1>
    <p class="lede">Search Spotify and file straight into a playlist. Destinations are ranked the same
      way the Inbox ranks them${r && r.ranked === false ? ' — once you have genre tags. Run <span class="mono">npm run enrich</span> to fetch them' : ''}.</p>
    <form class="rowbtns" id="findForm" style="margin:0 0 18px">
      <input type="search" id="q" placeholder="Artist, track, or both" value="${esc(q)}"
             style="flex:1; min-width:220px; font-size:15px; padding:9px 12px" autofocus>
      <button class="b p" type="submit">Search</button>
    </form>
    ${body}`;
}

function cmpTable(o) {
  const d = f => new Set(o.map(x => x[f])).size > 1;
  const [dD,dT,dR,dI] = ['dur','albumType','released','isrc'].map(d);
  return `<div class="tblwrap"><table class="cmp">
    <thead><tr><th>Length</th><th>Release</th><th>Date</th><th>ISRC</th><th>Album</th></tr></thead>
    <tbody>${o.map(x => `<tr>
      <td class="mono ${dD?'differs':''}">${esc(x.dur)}</td>
      <td class="${dT?'differs':''}">${esc(x.albumType ?? '—')}</td>
      <td class="mono ${dR?'differs':''}">${esc((x.released ?? '').slice(0,10))}</td>
      <td class="mono ${dI?'differs':''}">${esc(x.isrc ?? '—')}</td>
      <td>${esc(x.album)}</td></tr>`).join('')}</tbody></table></div>`;
}

function vDupes() {
  const w = data.dupes?.within ?? [];
  const exact = w.filter(x => x.verdict === 'same-recording');
  const clash = w.filter(x => x.verdict !== 'same-recording');

  const sec = (title, list, note, empty) => `
    <h2>${esc(title)} <span class="n">${num(list.length)}</span></h2>
    <p class="lede">${note}</p>
    ${list.length ? `<div class="rows">${list.slice(0, 60).map(c => {
      // Label each option by whatever actually distinguishes it, so two buttons
      // never both read "Keep 5:42".
      const differs = f => new Set(c.options.map(o => o[f])).size === c.options.length;
      const by = differs('dur') ? o => o.dur
               : differs('album') ? o => o.album
               : differs('released') ? o => (o.released ?? '').slice(0,4)
               : o => o.albumType ?? o.id.slice(0,4);
      return `<div class="row tall">
        ${art(c.art)}
        <div class="main">
          <div class="ttl">${esc(c.title)}</div>
          <div class="sub">${esc(c.artist ?? '')} · in ${esc(c.playlist)}</div>
          <div class="why">${esc(c.why)}</div>
          ${cmpTable(c.options)}
        </div>
        <div class="acts">
          ${c.options.map(o => `<button class="b sm" data-keep="${esc(o.id)}" data-pl="${esc(c.playlistId)}"
             data-drop="${esc(c.options.filter(z=>z.id!==o.id).map(z=>z.id).join(','))}"
             title="Keep this copy and remove the other">Keep ${esc(by(o))}</button>`).join('')}
        </div>
      </div>`;
    }).join('')}</div>` : `<div class="empty">${empty}</div>`}`;

  return `<h1>Duplicates</h1>
    <p class="lede">Only duplicates <b>inside a single playlist</b> are offered for removal. The same
      track in several playlists is treated as deliberate — see Cross-filed.</p>
    ${sec('Same recording', exact,
      'Both copies share an ISRC: one master issued on two releases. Removing either loses nothing.',
      'No exact repeats. Nothing is filed twice in the same playlist.')}
    ${sec('Version clashes', clash,
      'Genuinely different cuts sitting in one playlist. Values that differ are marked.',
      'No version clashes.')}`;
}

function vMisfile() {
  const all = data.misfile?.misfiled ?? [];
  const band = S.mfBand;
  const counts = { high:0, medium:0, low:0 };
  for (const x of all) counts[x.confidence] = (counts[x.confidence] ?? 0) + 1;
  const m = all.filter(x => x.confidence === band);

  return `<h1>Misfiles</h1>
    <p class="lede">Filed somewhere that fits far worse than another playlist <b>on the same axis</b> —
      a genre playlist is only ever compared with other genre playlists. Start at high confidence; the
      lower bands get increasingly speculative.</p>
    <div class="rowbtns" style="margin:0 0 16px">
      ${['high','medium','low'].map(b =>
        `<button class="b sm ${band===b?'p':''}" data-mfb="${b}">${b} <span class="mono">${counts[b] ?? 0}</span></button>`).join('')}
    </div>
    ${m.length ? `<div class="rows">${m.slice(0,80).map(x => `
      <div class="row tall">
        ${art(x.art)}
        <div class="main">
          <div class="ttl">${esc(x.title)}</div>
          <div class="sub">${esc(x.artist ?? '')} · ${esc(x.tags.slice(0,3).join(', '))}</div>
          <div class="why">Currently in <b>${esc(x.current)}</b> · fit ${conf(x.currentScore)}</div>
        </div>
        <div class="acts">
          ${x.suggest.filter(s => s.id).slice(0,2).map(s =>
            `<button class="b sm" data-mvtr="${esc(x.id)}" data-mvfrom="${esc(x.currentPlaylistId)}"
               data-mvto="${esc(s.id)}">→ ${esc(s.name)}</button>`).join('')}
          <button class="b sm q" data-dplay="${esc(x.id)}">Play</button>
        </div>
      </div>`).join('')}</div>`
    : `<div class="empty"><b>Nothing in this band</b>Try a lower confidence band, or recompute filing.</div>`}`;
}

function vCross() {
  const a = (data.dupes?.across ?? []).filter(x => x.placements.length >= S.crossMin);
  return `<h1>Cross-filed</h1>
    <p class="lede">Tracks in several playlists at once. Usually deliberate, so nothing is preselected —
      click a playlist to take the track out of just that one.</p>
    <div class="rowbtns" style="margin:0 0 16px">
      ${[2,3,4,5,6].map(n => `<button class="b sm ${S.crossMin===n?'p':''}" data-cmin="${n}">${n}+ playlists</button>`).join('')}
    </div>
    ${a.length ? `<div class="rows">${a.slice(0,80).map(c => `
      <div class="row tall">
        ${art(c.art)}
        <div class="main">
          <div class="ttl">${esc(c.title)}</div>
          <div class="sub">${esc(c.artist ?? '')}</div>
          ${c.mixedRecordings ? '<div class="why">These are <b>different recordings</b> across the playlists.</div>'
            : c.mixedReleases ? '<div class="why">Same song, <b>different pressings</b> across the playlists.</div>' : ''}
          <div class="tagrow" style="margin-top:8px">${c.placements.map(p =>
            `<button class="chip" data-xpl="${esc(p.playlistId)}" data-xtr="${esc(p.trackId)}"
               title="${esc(p.axis)}">${esc(p.playlist)}</button>`).join('')}</div>
        </div>
        <div class="acts"><span class="pill act">${c.placements.length} playlists</span></div>
      </div>`).join('')}</div>`
    : '<div class="empty"><b>Nothing at this threshold</b>Try a lower number.</div>'}`;
}

function vNew() {
  const c = data.misfile?.clusters ?? [];
  return `<h1>New playlists</h1>
    <p class="lede">Groups inside the unfiled backlog that fit none of your existing playlists.
      Each one is a category you may be missing.</p>
    ${c.length ? `<div class="rows">${c.map((x,i) => `
      <div class="row">
        <div class="main">
          <div class="ttl">${x.size} tracks · ${esc(x.tags.slice(0,4).join(', '))}</div>
          <div class="sub">${esc(x.tracks.slice(0,4).join(' · '))}</div>
        </div>
        <div class="acts">
          <input type="text" id="nm${i}" placeholder="Playlist name" value="${esc(x.tags[0] ?? '')}">
          <button class="b sm p" data-cluster="${i}">Create</button>
        </div>
      </div>`).join('')}</div>`
    : '<div class="empty"><b>No clusters</b>Run “Recompute filing” on the Overview to look for them.</div>'}`;
}

function vDiscover() {
  const d = data.discover ?? [];
  return `<h1>Discover</h1>
    <p class="lede">Every artist and track you already own is subtracted before ranking, so nothing
      here recycles your library. Refresh it with <span class="mono">npm run discover</span>.</p>
    ${d.length ? `<div class="rows">${d.map(x => `
      <div class="row">
        <div class="main">
          <div class="ttl">${esc(x.track)}</div>
          <div class="sub">${esc(x.artist)} · <span class="mono">${esc((x.released ?? '').slice(0,4))}</span>
            · via ${esc((x.via ?? []).join(', '))}</div>
        </div>
        <div class="acts">
          <button class="b sm q" data-dplay="${esc(x.spotify)}">Play</button>
          <a class="b sm" href="https://open.spotify.com/track/${esc(x.spotify)}" target="_blank" rel="noopener">Open</a>
        </div>
      </div>`).join('')}</div>`
    : '<div class="empty"><b>No discovery run yet</b>Run <span class="mono">npm run discover</span> to build a list.</div>'}`;
}

function vHistory() {
  const h = data.history ?? [];
  return `<h1>History</h1>
    <p class="lede">Every change Betterfy has made to your Spotify library, newest first. A move is one
      row, not two — undoing it puts the track back where it was.</p>
    ${h.length ? `<div class="rows">${h.map(x => `
      <div class="row">
        <div class="main">
          <div class="ttl">${esc(x.op)} ${x.playlistName ? `<span class="sub">${esc(x.playlistName)}</span>` : ''}</div>
          <div class="sub mono">${esc(x.at.replace('T',' ').slice(0,19))} · ${(x.trackIds ?? []).length} track(s)${
            x.steps?.length > 1 ? ` · ${x.steps.length} steps` : ''}${x.reason ? ' · ' + esc(x.reason) : ''}</div>
        </div>
        <div class="acts">${x.undoable ? `<button class="b sm" data-undo="${esc(x.at)}">Undo</button>` : ''}</div>
      </div>`).join('')}</div>`
    : '<div class="empty"><b>Nothing changed yet</b>Betterfy has not touched your library.</div>'}`;
}

const VIEWS = { home:vHome, find:vFind, inbox:vInbox, dupes:vDupes, cross:vCross,
                misfile:vMisfile, new:vNew, discover:vDiscover, history:vHistory };

function render() {
  $('#main').innerHTML = VIEWS[view]();
  document.querySelectorAll('.nav').forEach(n => n.setAttribute('aria-current', String(n.dataset.v === view)));
  if (view === 'find') $('#q')?.focus();
}

async function refresh() {
  S = { ...S, ...await api('summary') };
  const set = (id, n) => { const el = $(id); if (el) el.textContent = n ? num(n) : ''; };
  set('#c-inbox', S.backlog); set('#c-dupes', (S.exact ?? 0) + (S.clash ?? 0));
  set('#c-cross', S.crossFiled); set('#c-misfile', S.misfiled);
  set('#c-new', S.clusters); set('#c-disc', (data.discover ?? []).length);
  $('#foot').textContent = `${num(S.playlists)} playlists · ${num(S.tracks)} tracks`;
  render();
}

/* ---------------- events ---------------- */

document.querySelector('aside').onclick = async e => {
  if (e.target.closest('#showKeys')) { $('#keysheet').hidden = false; return; }
  const b = e.target.closest('.nav'); if (!b) return;
  view = b.dataset.v;
  if (view === 'history') data.history = await api('history');
  render();
};

$('#closeKeys').onclick = () => { $('#keysheet').hidden = true; };
$('#keysheet').onclick = e => { if (e.target.id === 'keysheet') $('#keysheet').hidden = true; };

$('#main').addEventListener('click', async e => {
  const go = e.target.closest('[data-go]');
  if (go) { view = go.dataset.go; if (view === 'history') data.history = await api('history'); return render(); }

  const cmin = e.target.closest('[data-cmin]'); if (cmin) { S.crossMin = +cmin.dataset.cmin; return render(); }
  const mfb = e.target.closest('[data-mfb]');   if (mfb)  { S.mfBand = mfb.dataset.mfb; return render(); }

  const add = e.target.closest('[data-addto]');
  if (add) return addHit(+add.dataset.addi, add.dataset.addto);

  const mv = e.target.closest('[data-mvto]');
  if (mv) {
    mv.disabled = true;
    try {
      const r = await api('move', { trackId: mv.dataset.mvtr, fromId: mv.dataset.mvfrom, toId: mv.dataset.mvto });
      const h = await api('history');
      say(`Moved to ${r.to}.`, h[0]?.at);
      mv.closest('.row').classList.add('gone');
      await refreshCounts();
    } catch (err) { say('Failed: ' + err.message); mv.disabled = false; }
    return;
  }

  const step = e.target.closest('[data-step]');
  if (step) {
    const was = step.textContent;
    step.disabled = true; step.textContent = 'Working…';
    try { await api('refresh', { step: step.dataset.step }); data = await loadAll(); say('Refreshed.'); await refresh(); }
    catch (err) { say('Failed: ' + err.message); step.disabled = false; step.textContent = was; }
    return;
  }

  const file = e.target.closest('[data-file]'); if (file) return fileCurrent(file.dataset.file);
  const act = e.target.closest('[data-act]');   if (act)  return inboxAct(act.dataset.act);

  const keep = e.target.closest('[data-keep]');
  if (keep) {
    const drop = keep.dataset.drop.split(',').filter(Boolean);
    keep.disabled = true;
    try {
      const r = await api('remove', { playlistId: keep.dataset.pl, trackIds: drop, reason: 'duplicate' });
      const h = await api('history');
      say(`Removed ${r.removed}.`, h[0]?.at);
      keep.closest('.row').classList.add('gone');
      data.dupes = await api('dupes');
      await refreshCounts();
    } catch (err) { say('Failed: ' + err.message); keep.disabled = false; }
    return;
  }

  const x = e.target.closest('[data-xpl]');
  if (x) {
    try {
      await api('remove', { playlistId: x.dataset.xpl, trackIds: [x.dataset.xtr], reason: 'cross-file trim' });
      const h = await api('history');
      say('Removed from that playlist.', h[0]?.at);
      x.classList.add('cut');
      await refreshCounts();
    } catch (err) { say('Failed: ' + err.message); }
    return;
  }

  const cl = e.target.closest('[data-cluster]');
  if (cl) {
    const name = $('#nm' + cl.dataset.cluster).value.trim();
    if (!name) return say('Give it a name first.');
    cl.disabled = true;
    try { await api('newPlaylist', { name }); say(`Created “${name}”.`); await refresh(); }
    catch (err) { say('Failed: ' + err.message); cl.disabled = false; }
    return;
  }

  const dp = e.target.closest('[data-dplay]');
  if (dp) {
    try { const r = await api('play', { trackId: dp.dataset.dplay }); say('Playing on ' + r.device + ' — this replaces what was playing.'); }
    catch (err) { say(err.message); }
    return;
  }

  const u = e.target.closest('[data-undo]');
  if (u) { lastUndoAt = u.dataset.undo; return undoLast(); }
});

$('#main').addEventListener('change', e => {
  if (e.target.id === 'anyPl' && e.target.value) fileCurrent(e.target.value);
  const sel = e.target.closest('[data-addsel]');
  if (sel && sel.value) { addHit(+sel.dataset.addsel, sel.value); sel.value = ''; }
});

$('#main').addEventListener('submit', async e => {
  if (e.target.id !== 'findForm') return;
  e.preventDefault();
  S.q = $('#q').value;
  S.finding = true; render();
  try { data.find = await api('search?q=' + encodeURIComponent(S.q)); }
  catch (err) { say('Search failed: ' + err.message); data.find = { rows: [], targets: [] }; }
  S.finding = false; render();
});

/** Refresh the rail counts without rebuilding the view under the user. */
async function refreshCounts() {
  S = { ...S, ...await api('summary') };
  const set = (id, n) => { const el = $(id); if (el) el.textContent = n ? num(n) : ''; };
  set('#c-inbox', S.backlog); set('#c-dupes', (S.exact ?? 0) + (S.clash ?? 0));
  set('#c-cross', S.crossFiled); set('#c-misfile', S.misfiled); set('#c-new', S.clusters);
  $('#foot').textContent = `${num(S.playlists)} playlists · ${num(S.tracks)} tracks`;
}

/** File a search result. The track travels with it — the server has not seen it. */
async function addHit(i, playlistId) {
  const t = data.find?.rows[i];
  if (!t) return;
  const name = data.find.targets.find(x => x.id === playlistId)?.name ?? 'that playlist';
  if (t.have.exact.includes(name)) return say(`Already in ${name}.`);
  try {
    await api('file', { playlistId, trackId: t.id, track: t, reason: 'added from search' });
    const h = await api('history');
    say(`Added “${t.name}” to ${name}.`, h[0]?.at);
    t.have.exact = [...t.have.exact, name];
    render();
    await refreshCounts();
  } catch (err) { say('Failed: ' + err.message); }
}

async function fileCurrent(playlistId) {
  const t = data.backlog.rows[S.inboxAt];
  if (!t) return;
  try {
    await api('file', { playlistId, trackId: t.id, reason: 'filed from inbox' });
    const h = await api('history');
    const name = data.backlog.targets.find(x => x.id === playlistId)?.name ?? 'the playlist';
    say(`Filed “${t.title}” into ${name}.`, h[0]?.at);
    data.backlog.rows.splice(S.inboxAt, 1);
    data.backlog.total--;
    render();
    await refreshCounts();
  } catch (err) { say('Failed: ' + err.message); }
}

async function inboxAct(a) {
  const i = S.inboxAt;
  const t = data.backlog?.rows[i];
  if (!t) return;
  if (a === 'play') {
    try { const r = await api('play', { trackId: t.id }); say('Playing on ' + r.device + ' — this replaces what was playing.'); }
    catch (e) { say(e.message); }
    return;
  }
  if (a === 'skip') { S.inboxAt = Math.min(i + 1, data.backlog.rows.length - 1); return render(); }
  if (a === 'unlike') {
    try {
      await api('unlike', { trackId: t.id });
      const h = await api('history');
      say(`Unliked “${t.title}”.`, h[0]?.at);
      data.backlog.rows.splice(i, 1);
      data.backlog.total--;
      render();
      await refreshCounts();
    } catch (e) { say('Failed: ' + e.message); }
  }
}

document.addEventListener('keydown', e => {
  if (e.target.matches('input,select,textarea')) return;
  if (e.key === 'Escape') { $('#keysheet').hidden = true; return; }
  if (e.key === '?') { $('#keysheet').hidden = !$('#keysheet').hidden; return; }
  if (e.key === '/') { e.preventDefault(); view = 'find'; return render(); }
  if (e.key.toLowerCase() === 'z' && lastUndoAt) { e.preventDefault(); return undoLast(); }

  if (view !== 'inbox') return;
  const t = data.backlog?.rows[S.inboxAt];
  if (!t) return;
  if (['1','2','3'].includes(e.key)) { const s = t.suggest[+e.key - 1]; if (s) fileCurrent(s.id); }
  if (e.key.toLowerCase() === 'p') inboxAct('play');
  if (e.key.toLowerCase() === 's') inboxAct('skip');
  if (e.key.toLowerCase() === 'u') inboxAct('unlike');
});

/* ---------------- boot ---------------- */

async function loadAll() {
  const [backlog, dupes, misfile, discover, history] = await Promise.all([
    api('backlog').catch(() => null), api('dupes').catch(() => null),
    api('misfile').catch(() => null), api('discover').catch(() => []),
    api('history').catch(() => []),
  ]);
  return { backlog, dupes, misfile, discover, history };
}

(async () => {
  try {
    data = await loadAll();
    await refresh();
    $('#who').textContent = 'local · 127.0.0.1';
  } catch (e) {
    $('#main').innerHTML = `<div class="boot"><div class="in">
      <h1>Not ready yet</h1>
      <p class="lede">${esc(e.message)}</p>
      <p class="lede">If this is a fresh install, run <span class="mono">npm run setup</span> first —
        it authorises Spotify and takes the first snapshot.</p>
      <button class="b p" onclick="location.reload()">Try again</button>
    </div></div>`;
  }
})();
</script>
