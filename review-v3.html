<title>Engine v3 — Review Queue</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root{
    --ground:#F1F3F6; --surface:#FFFFFF; --surface-2:#F7F8FA; --surface-3:#EDEFF4;
    --ink:#141821; --ink-2:#4E586A; --ink-3:#798394;
    --line:#DCE1E8; --line-2:#C7CEDA;
    --accent:#D9502B; --accent-ink:#FFFFFF; --accent-soft:#FBEAE4;
    --ok:#1F7F58; --ok-soft:#E3F2EA;
    --warn:#9A6B0E; --warn-soft:#F8EFD9;
    --info:#2C5FA8; --info-soft:#E4EDF9;
    --idle:#98A2B3;
    --r:7px;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --ground:#0E1116; --surface:#161A21; --surface-2:#1C212A; --surface-3:#222835;
      --ink:#E7EBF1; --ink-2:#A3AEBF; --ink-3:#7B8698;
      --line:#252B35; --line-2:#333B48;
      --accent:#FF7A52; --accent-ink:#20120C; --accent-soft:#2E1C15;
      --ok:#4FBE8B; --ok-soft:#12261D;
      --warn:#D9A83E; --warn-soft:#2A2113;
      --info:#7FA9E8; --info-soft:#15202F;
      --idle:#5C6675;
    }
  }
  :root[data-theme="dark"]{
    --ground:#0E1116; --surface:#161A21; --surface-2:#1C212A; --surface-3:#222835;
    --ink:#E7EBF1; --ink-2:#A3AEBF; --ink-3:#7B8698;
    --line:#252B35; --line-2:#333B48;
    --accent:#FF7A52; --accent-ink:#20120C; --accent-soft:#2E1C15;
    --ok:#4FBE8B; --ok-soft:#12261D;
    --warn:#D9A83E; --warn-soft:#2A2113;
    --info:#7FA9E8; --info-soft:#15202F;
    --idle:#5C6675;
  }

  *{box-sizing:border-box}
  body{background:var(--ground); color:var(--ink);
       font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
       font-size:14px; line-height:1.5; margin:0; -webkit-font-smoothing:antialiased}
  .wrap{max-width:1200px; margin:0 auto; padding:28px 22px 110px}

  header.top{display:flex; flex-wrap:wrap; align-items:flex-end; gap:18px; justify-content:space-between; margin-bottom:18px}
  h1{font-family:Archivo,system-ui,sans-serif; font-weight:800; font-size:29px; letter-spacing:-.024em; margin:0; text-wrap:balance}
  .sub{color:var(--ink-2); margin:5px 0 0; max-width:66ch}
  .stamp{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-3); text-align:right; line-height:1.7}

  .banner{background:var(--info-soft); color:var(--info); border-radius:var(--r); padding:9px 13px;
          font-size:12.5px; margin-bottom:20px; border:1px solid transparent}

  .meters{display:grid; grid-template-columns:repeat(auto-fit,minmax(178px,1fr)); gap:12px; margin-bottom:26px}
  .meter{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:13px 15px; display:flex; flex-direction:column; gap:3px}
  .meter .n{font-family:"IBM Plex Mono",monospace; font-size:26px; font-weight:600; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
  .meter .l{font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3); font-weight:600}
  .meter .d{font-size:12px; color:var(--ink-2)}
  .meter.act .n{color:var(--accent)} .meter.jud .n{color:var(--warn)}

  nav.tabs{display:flex; gap:2px; border-bottom:1px solid var(--line); margin-bottom:16px; flex-wrap:wrap}
  .tab{appearance:none; background:none; border:0; border-bottom:2px solid transparent; font:inherit; font-weight:600;
       color:var(--ink-3); cursor:pointer; padding:9px 14px; margin-bottom:-1px; border-radius:var(--r) var(--r) 0 0}
  .tab:hover{color:var(--ink); background:var(--surface-2)}
  .tab[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent)}
  .tab .c{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-3); margin-left:6px}

  .lede{color:var(--ink-2); margin:0 0 14px; max-width:80ch}
  .lede b{color:var(--ink); font-weight:600}

  .rows{display:flex; flex-direction:column; gap:8px}
  .row{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
       display:grid; grid-template-columns:3px 1fr auto; overflow:hidden}
  .stripe{background:var(--idle)}
  .row[data-band="AMBIGUOUS"] .stripe{background:var(--accent)}
  .row[data-band="INSUFFICIENT_DATA"] .stripe{background:var(--warn)}
  .row[data-band="LIKELY"] .stripe{background:var(--info)}
  .row[data-band="HIGH"] .stripe{background:var(--ok)}
  .row[data-done="1"] .stripe{background:var(--ok)}
  .row[data-done="1"] .body{opacity:.62}
  .body{padding:12px 15px; min-width:0}
  .ctrl{padding:12px 15px; border-left:1px solid var(--line); background:var(--surface-2);
        display:flex; flex-direction:column; gap:6px; justify-content:center; min-width:218px}
  .head{display:flex; align-items:baseline; gap:9px; flex-wrap:wrap}
  .title{font-weight:600; letter-spacing:-.005em}
  .artist{color:var(--ink-2)}
  .where{font-family:"IBM Plex Mono",monospace; font-size:10.5px; font-weight:500; letter-spacing:.06em;
         text-transform:uppercase; color:var(--ink-3); margin-bottom:3px}
  .why{margin-top:7px; font-size:12.5px; color:var(--ink-2); background:var(--surface-3);
       border-radius:5px; padding:5px 9px}
  .why ul{margin:0; padding-left:17px} .why li{margin:1px 0}
  .expl{margin-top:6px; font-size:12px; color:var(--ink-3); font-family:"IBM Plex Mono",monospace}

  .flag{font-size:11px; font-weight:600; border-radius:4px; padding:2px 7px; background:var(--info-soft); color:var(--info)}
  .flag.warn{background:var(--warn-soft); color:var(--warn)}
  .flag.ok{background:var(--ok-soft); color:var(--ok)}
  .flag.act{background:var(--accent-soft); color:var(--accent)}
  .tag{font-size:11.5px; border:1px solid var(--line); border-radius:20px; padding:2px 9px;
       background:var(--surface-3); color:var(--ink-2); font-family:"IBM Plex Mono",monospace}

  button.act{appearance:none; font:inherit; font-size:12.5px; font-weight:600; cursor:pointer;
             border:1px solid var(--line-2); background:var(--surface); color:var(--ink);
             border-radius:5px; padding:6px 11px; text-align:center}
  button.act:hover{border-color:var(--ink-3)}
  button.act[aria-pressed="true"]{background:var(--ok); border-color:var(--ok); color:#fff}
  button.act.sm{font-size:11.5px; padding:4px 9px; font-weight:500}
  button.act.ghost[aria-pressed="true"]{background:var(--ink-3); border-color:var(--ink-3); color:#fff}
  input.pick{font:inherit; font-size:12.5px; padding:5px 8px; border-radius:5px;
             border:1px solid var(--line-2); background:var(--surface); color:var(--ink); width:100%}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px}

  .filters{display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; align-items:center}
  .filters .lbl{font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3); font-weight:600; margin-right:3px}
  .empty{color:var(--ink-3); padding:26px; text-align:center; background:var(--surface); border:1px dashed var(--line); border-radius:var(--r)}

  .dock{position:fixed; left:0; right:0; bottom:0; background:var(--surface); border-top:1px solid var(--line); z-index:9}
  .dock .in{max-width:1200px; margin:0 auto; padding:11px 22px; display:flex; align-items:center; gap:14px; flex-wrap:wrap}
  .tally{font-family:"IBM Plex Mono",monospace; font-size:12.5px; color:var(--ink-2); font-variant-numeric:tabular-nums}
  .tally b{color:var(--ink); font-weight:600}
  .save{margin-left:auto; font-size:12px; color:var(--ink-3); font-family:"IBM Plex Mono",monospace}

  table.grid{width:100%; border-collapse:collapse; font-size:13px; background:var(--surface);
             border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
  table.grid th{text-align:left; font-size:10px; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3);
                font-weight:600; padding:9px 12px; background:var(--surface-2); border-bottom:1px solid var(--line)}
  table.grid td{padding:7px 12px; border-top:1px solid var(--line); vertical-align:top}
  table.grid .mono{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; white-space:nowrap}

  @media (max-width:760px){
    .row{grid-template-columns:3px 1fr}
    .ctrl{border-left:0; border-top:1px solid var(--line); grid-column:2; min-width:0}
  }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Engine v3 — Review Queue</h1>
      <p class="sub">What the evidence engine could not settle on its own, ordered by how much answering it is worth.</p>
    </div>
    <div class="stamp" id="stamp"></div>
  </header>

  <div class="banner" id="banner"></div>
  <div class="meters" id="meters"></div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <p class="lede" id="lede"></p>
  <div id="panel"></div>
</div>

<div class="dock"><div class="in">
  <span class="tally" id="tally"></span>
  <button class="act" id="dl">Download corrections.json</button>
  <button class="act sm" id="copy">Copy JSON</button>
  <button class="act sm ghost" id="reset">Clear answers</button>
  <span class="save" id="saved"></span>
</div></div>

<datalist id="genrelist"></datalist>
<datalist id="typelist"></datalist>

<script>
const D = __DATA__;

/* ---------- answers ----------
 * Held per viewer in localStorage: a convenience so a half-worked queue
 * survives a refresh, never the record itself. The record is the exported
 * corrections.json, which is what the engine reads. Every read and write is
 * guarded — a private window or blocked site data must not break the page. */
const KEY = 'betterfy-v3-review';
let answers = {};
try { answers = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch { answers = {}; }
const persist = () => {
  try { localStorage.setItem(KEY, JSON.stringify(answers)); saved('saved locally'); }
  catch { saved('not saved — storage unavailable'); }
};
const saved = t => { document.getElementById('saved').textContent = t; };

/* Corrections already in corrections.json. Shown as done, never re-asked —
 * the same rule trackQueue() follows when it skips answered tracks. */
const alreadyGenre = new Set(D.existing.filter(e => e.kind === 'genre' || e.kind === 'not-sure').map(e => e.trackId));
const alreadyType = new Set(D.existing.filter(e => e.kind === 'playlist-type').map(e => e.playlistId));
const alreadyConcept = new Set(D.existing.filter(e => e.kind === 'concept').map(e => (e.raw || '').toLowerCase()));

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pct = x => (100 * (x || 0)).toFixed(1) + '%';

/**
 * One answer, expanded into corrections.
 *
 * A collapsed question covers many tracks — that is the point of collapsing
 * it — so answering once writes one correction per track it covers. The log
 * is per track because that is what the engine reads back.
 */
function toCorrections() {
  const out = [];
  const at = Date.now();
  for (const [key, a] of Object.entries(answers)) {
    if (!a || !a.kind) continue;
    if (a.kind === 'genre' || a.kind === 'not-sure')
      for (const id of a.trackIds || []) out.push({ kind: a.kind, trackId: id, playlistId: null,
        fromPlaylistId: null, value: a.value ?? null, raw: null, at: a.at || at, note: 'review-v3', version: '3.0.0' });
    else if (a.kind === 'playlist-type')
      out.push({ kind: 'playlist-type', trackId: null, playlistId: a.playlistId, fromPlaylistId: null,
        value: a.value, raw: null, at: a.at || at, note: 'review-v3', version: '3.0.0' });
    else if (a.kind === 'concept')
      out.push({ kind: 'concept', trackId: null, playlistId: null, fromPlaylistId: null,
        value: a.value, raw: a.raw, at: a.at || at, note: 'review-v3', version: '3.0.0' });
    void key;
  }
  return out;
}

/* The export merges onto what is already in corrections.json rather than
 * replacing it: the log is append-only (§39), and a review session that threw
 * away last month's answers would be the exact failure that layer exists to
 * prevent. */
const exportJSON = () => JSON.stringify({ version: '3.0.0', entries: [...D.existing, ...toCorrections()] }, null, 2);

function answeredCount() {
  let q = 0, tracks = 0;
  for (const a of Object.values(answers)) {
    if (!a || !a.kind) continue;
    q++;
    if (a.trackIds) tracks += a.trackIds.length;
  }
  return { q, tracks };
}

function tally() {
  const { q, tracks } = answeredCount();
  const pend = D.queue.tracks.length + D.queue.playlists.length + D.queue.concepts.length;
  document.getElementById('tally').innerHTML =
    `<b>${q}</b> answered${tracks ? ` &middot; <b>${tracks}</b> tracks covered` : ''} &middot; ${pend} in the queue`;
}

/* ---------- header ---------- */
document.getElementById('stamp').innerHTML =
  `${esc(new Date(D.generatedAt).toISOString().slice(0, 16).replace('T', ' '))} UTC<br>`
  + `engine ${esc(D.versions.engine)} &middot; ontology ${esc(D.versions.ontology)}`;

document.getElementById('banner').textContent =
  'Nothing here is wired into the app — profile.mjs and axes.mjs still produce every suggestion you see. '
  + 'Answers are collected in this page and exported as corrections.json for you to save into the repo.';

const r = D.report;
const corroborated = D.queue.tracks.length;
document.getElementById('meters').innerHTML = [
  ['', r.tracks, 'tracks', 'distinct recordings profiled'],
  ['', pct(r.coverage), 'classified', `${r.classified} got a genre`],
  ['jud', (r.bands.AMBIGUOUS || 0) + (r.bands.INSUFFICIENT_DATA || 0), 'unsettled', 'ambiguous or not enough evidence'],
  ['act', D.queue.tracks.length, 'questions', `covering ${D.queue.tracks.reduce((s, x) => s + x.tracks, 0)} tracks`],
  ['', D.queue.concepts.length, 'unmapped tags', 'one answer fixes every track carrying it'],
].map(([cls, n, l, d]) =>
  `<div class="meter ${cls}"><span class="n">${esc(n)}</span><span class="l">${esc(l)}</span><span class="d">${esc(d)}</span></div>`
).join('');
void corroborated;

/* ---------- pickers ---------- */
document.getElementById('genrelist').innerHTML = D.genres.map(g => `<option value="${esc(g)}">`).join('');
document.getElementById('typelist').innerHTML = D.playlistTypes.map(t => `<option value="${esc(t)}">`).join('');

/* ---------- tabs ---------- */
const TABS = [
  { id: 'tracks', label: 'Tracks', count: () => D.queue.tracks.length,
    lede: 'Each row is <b>one question</b>, not one track. Tracks resting on the same evidence give the same answer, so they are asked about once and answered together — the count says how many ride on it.' },
  { id: 'playlists', label: 'Playlists', count: () => D.queue.playlists.length,
    lede: 'Playlists whose type the engine could not settle, whose name disagrees with their contents, or that duplicate another. Confirming a type overrides the engine for your library only.' },
  { id: 'tags', label: 'Unmapped tags', count: () => D.queue.concepts.length,
    lede: 'Tags nothing in the ontology can place. These are kept, never discarded — answering one fixes <b>every</b> track carrying it, without waiting for an ontology release.' },
  { id: 'library', label: 'Library', count: () => null,
    lede: 'What the pass learned about itself, and what it found that is not a question: playlist types, relationships, and music you own but never filed.' },
];
let tab = 'tracks';

function renderTabs() {
  document.getElementById('tabs').innerHTML = TABS.map(t => {
    const c = t.count();
    return `<button class="tab" role="tab" data-tab="${t.id}" aria-selected="${t.id === tab}">`
      + `${esc(t.label)}${c === null ? '' : `<span class="c">${c}</span>`}</button>`;
  }).join('');
  document.getElementById('lede').innerHTML = TABS.find(t => t.id === tab).lede;
}

/* ---------- panels ---------- */
/* classifyGenre()'s explanation lines carry a `mark` saying what kind of
 * statement each one is. Rendering the object instead of its text printed
 * "[object Object]"; these are the four marks explain() actually emits. */
const MARK = { tick: '✓', note: '·', warn: '!', x: '✕' };

function bandFlag(b) {
  const cls = b === 'HIGH' ? 'ok' : b === 'LIKELY' ? '' : b === 'AMBIGUOUS' ? 'act' : 'warn';
  return `<span class="flag ${cls}">${esc(b || 'UNKNOWN')}</span>`;
}

function trackRows() {
  if (!D.queue.tracks.length) return `<div class="empty">Nothing worth asking about.</div>`;
  return `<div class="rows">` + D.queue.tracks.map((q, i) => {
    const key = 't' + i;
    const a = answers[key];
    const done = a?.kind ? 1 : (q.trackIds || []).every(id => alreadyGenre.has(id)) ? 1 : 0;
    const choices = [q.suggested, ...(q.alternatives || [])].filter(Boolean)
      .filter((v, ix, arr) => arr.indexOf(v) === ix).slice(0, 4);
    return `<div class="row" data-band="${esc(q.confidence)}" data-done="${done}">
      <div class="stripe"></div>
      <div class="body">
        <div class="where">${esc(q.confidence)} &middot; score ${esc(q.score)}${q.tracks > 1 ? ` &middot; ${q.tracks} tracks ride on this answer` : ''}</div>
        <div class="head">
          <span class="title">${esc(q.title || '(untitled)')}</span>
          <span class="artist">${esc(q.artist || 'unknown artist')}</span>
          ${bandFlag(q.confidence)}
          ${q.suggested ? `<span class="flag">probably ${esc(q.suggested)}</span>` : `<span class="flag warn">no answer</span>`}
        </div>
        ${q.tracks > 1 ? `<div class="expl">also: ${(q.examples || []).slice(1, 4).map(e => esc(`${e.artist} — ${e.title}`)).join(' &middot; ')}${q.tracks > 4 ? ` &middot; +${q.tracks - 4} more` : ''}</div>` : ''}
        <div class="why"><ul>${(q.reasons || []).map(x => `<li>${esc(x.why)}</li>`).join('')}</ul></div>
        ${(q.unknown || []).length ? `<div class="expl">unplaced tags: ${q.unknown.slice(0, 6).map(u => `<span class="tag">${esc(u)}</span>`).join(' ')}</div>` : ''}
        ${(q.explanation || []).length ? `<div class="expl">${q.explanation.slice(0, 4).map(x => `${MARK[x.mark] || '·'} ${esc(x.text)}`).join('<br>')}</div>` : ''}
      </div>
      <div class="ctrl">
        ${choices.map(c => `<button class="act sm" data-k="${key}" data-genre="${esc(c)}" aria-pressed="${a?.value === c}">${esc(c)}</button>`).join('')}
        <input class="pick" list="genrelist" placeholder="another genre…" data-k="${key}" value="${esc(a && !choices.includes(a.value) && a.kind === 'genre' ? a.value : '')}">
        <button class="act sm ghost" data-k="${key}" data-unsure="1" aria-pressed="${a?.kind === 'not-sure'}">Not sure</button>
      </div>
    </div>`;
  }).join('') + `</div>`;
}

function playlistRows() {
  if (!D.queue.playlists.length) return `<div class="empty">No playlist is in doubt.</div>`;
  const byId = new Map(D.playlists.map(p => [p.id, p]));
  return `<div class="rows">` + D.queue.playlists.map((q, i) => {
    const key = 'p' + i;
    const a = answers[key];
    const p = byId.get(q.id);
    const done = a?.kind ? 1 : alreadyType.has(q.id) ? 1 : 0;
    const opts = [p?.type, 'GENRE', 'MOOD', 'OCCASION', 'EVENT', 'ARTIST', 'MIXED']
      .filter(Boolean).filter((v, ix, arr) => arr.indexOf(v) === ix).slice(0, 5);
    return `<div class="row" data-band="${esc(p?.confidence)}" data-done="${done}">
      <div class="stripe"></div>
      <div class="body">
        <div class="where">${esc(p?.type || 'UNKNOWN')} &middot; ${esc(p?.confidence || '')}${p?.isTarget ? ' &middot; takes filing suggestions' : ''}</div>
        <div class="head">
          <span class="title">${esc(q.name)}</span>
          ${p?.musicalIdentity?.primary ? `<span class="flag">made of ${esc(p.musicalIdentity.primary)}</span>` : ''}
          ${p?.hybridOf ? `<span class="flag warn">hybrid of ${esc(p.hybridOf.join(' + '))}</span>` : ''}
        </div>
        <div class="why"><ul>${(q.reasons || []).map(x => `<li>${esc(x.detail || x.why)}</li>`).join('')}</ul></div>
      </div>
      <div class="ctrl">
        ${opts.map(o => `<button class="act sm" data-k="${key}" data-type="${esc(o)}" data-pid="${esc(q.id)}" aria-pressed="${a?.value === o}">${esc(o)}</button>`).join('')}
      </div>
    </div>`;
  }).join('') + `</div>`;
}

function tagRows() {
  if (!D.queue.concepts.length) return `<div class="empty">Every tag in this library maps to something the ontology knows.</div>`;
  return `<div class="rows">` + D.queue.concepts.map((c, i) => {
    const key = 'c' + i;
    const a = answers[key];
    const done = a?.kind ? 1 : alreadyConcept.has((c.raw || '').toLowerCase()) ? 1 : 0;
    return `<div class="row" data-band="LIKELY" data-done="${done}">
      <div class="stripe"></div>
      <div class="body">
        <div class="where">${esc(c.tracks)} track${c.tracks === 1 ? '' : 's'} &middot; from ${esc((c.sources || []).join(', ') || 'unknown')}</div>
        <div class="head"><span class="title">${esc(c.raw)}</span></div>
        <div class="why">${esc(c.why)}</div>
      </div>
      <div class="ctrl">
        <input class="pick" list="genrelist" placeholder="means…" data-k="${key}" data-raw="${esc(c.raw)}" value="${esc(a?.value || '')}">
      </div>
    </div>`;
  }).join('') + `</div>`;
}

function libraryPanel() {
  const bands = Object.entries(D.report.bands).sort((a, b) => b[1] - a[1]);
  const types = {};
  for (const p of D.playlists) (types[p.type] ??= []).push(p);
  const rel = {};
  for (const x of D.relationships) (rel[x.kind] ??= []).push(x);

  return `
  <table class="grid"><thead><tr><th>Confidence band</th><th>Tracks</th><th>Share</th></tr></thead><tbody>
  ${bands.map(([b, n]) => `<tr><td>${bandFlag(b)}</td><td class="mono">${n}</td><td class="mono">${pct(n / D.report.tracks)}</td></tr>`).join('')}
  </tbody></table>

  <h3>Playlists by type</h3>
  <table class="grid"><thead><tr><th>Type</th><th>Count</th><th>Take filing</th><th>Examples</th></tr></thead><tbody>
  ${Object.entries(types).sort((a, b) => b[1].length - a[1].length).map(([t, ps]) =>
    `<tr><td><b>${esc(t)}</b></td><td class="mono">${ps.length}</td><td class="mono">${ps.filter(p => p.isTarget).length}</td>
     <td>${ps.slice(0, 4).map(p => esc(p.name)).join(', ')}</td></tr>`).join('')}
  </tbody></table>

  ${D.nameVsMusic.length ? `<h3>Named one thing, made of another</h3>
  <table class="grid"><thead><tr><th>Playlist</th><th>Called</th><th>Actually</th></tr></thead><tbody>
  ${D.nameVsMusic.slice(0, 20).map(d => `<tr><td>${esc(d.name)}</td><td class="mono">${esc(d.named)}</td><td class="mono">${esc(d.actual)}</td></tr>`).join('')}
  </tbody></table>` : ''}

  ${Object.keys(rel).length ? `<h3>Playlist relationships</h3>
  <table class="grid"><thead><tr><th>Kind</th><th>Pair</th><th>Why</th></tr></thead><tbody>
  ${Object.entries(rel).flatMap(([k, xs]) => xs.slice(0, 5).map(x =>
    `<tr><td class="mono">${esc(k)}</td><td>${esc(x.a.name)} &harr; ${esc(x.b.name)}</td><td>${esc(x.why)}</td></tr>`)).join('')}
  </tbody></table>` : ''}

  ${D.unfiled && D.unfiled.count ? `<h3>Liked, filed nowhere (${D.unfiled.count})</h3>
  <table class="grid"><thead><tr><th>Track</th><th>Genre</th><th>Would fit</th></tr></thead><tbody>
  ${D.unfiled.top.slice(0, 20).map(u => `<tr><td>${esc(u.artist)} — ${esc(u.name)}</td><td class="mono">${esc(u.genre || '—')}</td>
    <td>${u.suggested ? esc(u.suggested.name) + ` <span class="mono">(${esc(u.suggested.score)})</span>` : '<span class="flag warn">nothing fits</span>'}</td></tr>`).join('')}
  </tbody></table>` : ''}

  ${D.underserved.length ? `<h3>Played but barely filed</h3>
  <table class="grid"><thead><tr><th>Genre</th><th>Played</th><th>Filed</th></tr></thead><tbody>
  ${D.underserved.slice(0, 15).map(u => `<tr><td class="mono">${esc(u.concept)}</td><td class="mono">${esc(u.played)}</td><td class="mono">${esc(u.filed)}</td></tr>`).join('')}
  </tbody></table>` : ''}

  ${D.report.unknownConcepts.length ? `<h3>Most common unplaced tags</h3>
  <table class="grid"><thead><tr><th>Tag</th><th>Tracks</th></tr></thead><tbody>
  ${D.report.unknownConcepts.slice(0, 20).map(u => `<tr><td class="mono">${esc(u.raw)}</td><td class="mono">${esc(u.count)}</td></tr>`).join('')}
  </tbody></table>` : ''}`;
}

function render() {
  renderTabs();
  document.getElementById('panel').innerHTML =
    tab === 'tracks' ? trackRows()
    : tab === 'playlists' ? playlistRows()
    : tab === 'tags' ? tagRows()
    : libraryPanel();
  tally();
}

/* ---------- interaction ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab]');
  if (t) { tab = t.dataset.tab; render(); return; }

  const b = e.target.closest('button[data-k]');
  if (!b) return;
  const key = b.dataset.k;
  const cur = answers[key];

  if (b.dataset.genre) {
    const q = D.queue.tracks[+key.slice(1)];
    answers[key] = cur?.value === b.dataset.genre ? null
      : { kind: 'genre', value: b.dataset.genre, trackIds: q.trackIds, at: Date.now() };
  } else if (b.dataset.unsure) {
    const q = D.queue.tracks[+key.slice(1)];
    answers[key] = cur?.kind === 'not-sure' ? null
      : { kind: 'not-sure', value: null, trackIds: q.trackIds, at: Date.now() };
  } else if (b.dataset.type) {
    answers[key] = cur?.value === b.dataset.type ? null
      : { kind: 'playlist-type', value: b.dataset.type, playlistId: b.dataset.pid, at: Date.now() };
  }
  persist(); render();
});

document.addEventListener('change', e => {
  const i = e.target.closest('input.pick');
  if (!i) return;
  const key = i.dataset.k;
  const v = i.value.trim();
  if (!v) { answers[key] = null; }
  else if (i.dataset.raw !== undefined) {
    // A tag mapping is only useful if it lands on a concept the ontology
    // knows; anything else is a second unplaced string.
    if (!D.genres.includes(v) && !D.moods.includes(v) && !D.contexts.includes(v)) {
      saved(`"${v}" is not a concept the ontology knows`);
      return;
    }
    answers[key] = { kind: 'concept', raw: i.dataset.raw, value: v, at: Date.now() };
  } else {
    const q = D.queue.tracks[+key.slice(1)];
    if (!D.genres.includes(v)) { saved(`"${v}" is not a genre the ontology knows`); return; }
    answers[key] = { kind: 'genre', value: v, trackIds: q.trackIds, at: Date.now() };
  }
  persist(); render();
});

document.getElementById('dl').onclick = () => {
  const blob = new Blob([exportJSON()], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'corrections.json';
  a.click();
  URL.revokeObjectURL(a.href);
  saved('downloaded — save it beside library.json');
};

document.getElementById('copy').onclick = async () => {
  try { await navigator.clipboard.writeText(exportJSON()); saved('copied'); }
  catch { saved('copy failed — use Download'); }
};

document.getElementById('reset').onclick = () => {
  if (!confirm('Clear the answers you have made in this page? Anything already in corrections.json is untouched.')) return;
  answers = {};
  try { localStorage.removeItem(KEY); } catch { /* nothing to clear */ }
  saved('cleared');
  render();
};

render();
</script>
