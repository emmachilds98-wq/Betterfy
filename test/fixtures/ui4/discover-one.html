<h1>Discover</h1>
    <p class="lede">New music, with everything you already own taken out.</p>
    
    <div class="rowbtns" style="margin-bottom:16px">
      <select data-act="discPl" id="discPl" aria-label="Find new music from">
        <option value="">Everything I listen to</option>
        <optgroup label="Playlist radio">
          <option value="p1" >Jungle &amp; Breaks</option><option value="p2" >Late Night &lt;Deep&gt;</option>
        </optgroup>
      </select>
      <button class="b p" data-act="discRun" id="discRun" >Find new music</button>
    </div><div class="counter" style="margin:0 0 14px">
      <span style="font-family:var(--mono); font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent)">via Tim Reaper · 1 of 2</span>
      <span>from Jungle &amp; Breaks</span>
    </div>
    <div class="deck">
      <div class="card disc">
        <div class="prog"><i style="width:50.00%"></i></div>
        <div class="now">
          <div class="artwrap"><div class="art ph" data-dplay="d2" data-ddur="200000" title="Play" style="background:linear-gradient(150deg,hsl(200 62% 56%),hsl(248 58% 44%))">J</div></div>
          <div class="txt">
            <p class="t">Jumpin</p><p class="a">Sherelle</p>
            <div class="m"><span></span><span>2022</span><span>3:20</span></div>
          </div>
        </div>

        <div class="player">
          <button class="tbtn" id="pToggle" aria-label="Play"><svg id="playicon"></svg></button>
          <input class="seek" id="seek" type="range" min="0" max="200000" step="1000" value="0"
                 aria-label="Playing position" disabled>
          <span class="tm"><span id="pTime">0:00</span> / <span id="pDur">3:20</span></span>
        </div>
        <p class="pdev" id="pDev"></p>

        <p class="why discwhy">Because you listen to <b>Tim Reaper</b>.</p>
        
        <button class="fitcall" data-act="dfile" data-dfile="p1">
            <span class="mid"><span class="nm">Would sit well in Jungle &amp; Breaks</span>
              <span class="ax"><b>genre</b> playlist · ranked by the same model the file queue uses</span></span>
            <span class="sc">Likely</span>
          </button>
        
        

        <div class="rowbtns" style="margin-top:20px">
          <button class="b big go grow" data-act="dfile" data-dfile="p1">Add to Jungle &amp; Breaks</button>
          <button class="b big" data-act="dnav" data-dnav="1" >Next →</button>
        </div>
        <div class="rowbtns" style="margin-top:10px">
          <button class="b sm" data-act="dnav" data-dnav="-1" disabled>← Back</button>
          <button class="b sm" data-act="dpass" data-dpass="d2" title="Not for me: this artist won't be offered again">Not for me</button>
          <button class="b sm" data-act="like" data-like="d2">Like</button>
          <a class="b sm" href="https://open.spotify.com/track/d2" target="_blank" rel="noopener">Open</a>
          <select data-act="discAnyPl" id="discAnyPl"><option value="">Add to another playlist…</option><option value="p1">Jungle &amp; Breaks</option><option value="p2">Late Night &lt;Deep&gt;</option><option value="p3">Rollers</option></select>
        </div>
      </div>
    </div>
